<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pokémon Emerald</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         CABEÇALHO
    ========================================== -->

    <header class="header">

        <h1>
            Pokémon Emerald
        </h1>

        <p>
            Pokédex
        </p>

    </header>


    <!-- =========================================
         CONTEÚDO PRINCIPAL
    ========================================== -->

    <main>


        <!-- =====================================
             TÍTULO
        ====================================== -->

        <section class="title">

            <h2>
                Pokémon
            </h2>

            <p>
                Escolha um Pokémon para visualizar seus dados.
            </p>

        </section>


        <!-- =====================================
             LISTA DE POKÉMON
        ====================================== -->

        <section
            id="pokemon-list"
            class="list-pokemon"
        >

            <div class="loading">

                Carregando Pokémon...

            </div>

        </section>


        <!-- =====================================
             PAGINAÇÃO
        ====================================== -->

        <nav class="pagination">

            <button id="previous">

                ◀ ANTERIOR

            </button>


            <span id="page">

                Página 1

            </span>


            <button id="next">

                PRÓXIMO ▶

            </button>

        </nav>


    </main>


    <!-- =========================================
         RODAPÉ
    ========================================== -->

    <footer>

        <p>

            Projeto Pokémon Emerald • PokéAPI

        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
