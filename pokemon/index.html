<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Informações do Pokémon</title>


    <style>

        /* =========================================
           CONFIGURAÇÕES GERAIS
        ========================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family: "Courier New", monospace;

            background:

                linear-gradient(

                    180deg,

                    #83a55c 0px,

                    #83a55c 65px,

                    #536b42 65px,

                    #536b42 75px,

                    #806b62 75px,

                    #806b62 100%

                );

            color: #222;

            padding: 30px;
        }


        /* =========================================
           BOTÃO VOLTAR
        ========================================= */

        .return {

            display: inline-block;

            background: #e8c928;

            border: 4px solid #71621b;

            padding: 10px 18px;

            color: #222;

            text-decoration: none;

            font-weight: bold;

            box-shadow: 4px 4px #333;

            margin-bottom: 25px;
        }


        .return:hover {

            background: #f5dd52;
        }


        /* =========================================
           TELA PRINCIPAL
        ========================================= */

        .pokemon-screen {

            max-width: 1000px;

            margin: auto;

            background: #74dca5;

            border: 7px solid #315d56;

            border-radius: 12px;

            padding: 25px;

            box-shadow: 8px 8px #333;
        }


        /* =========================================
           CABEÇALHO DO POKÉMON
        ========================================= */

        .header-pokemon {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            background: #c6d56a;

            border: 5px solid #5d553b;

            padding: 10px 20px;

            margin-bottom: 20px;
        }


        .name {

            font-size: 32px;

            text-transform: capitalize;

            font-weight: bold;
        }


        .number {

            font-size: 24px;

            font-weight: bold;
        }


        /* =========================================
           CONTEÚDO
        ========================================= */

        .content {

            display: grid;

            grid-template-columns:
                330px 1fr;

            gap: 25px;
        }


        /* =========================================
           ÁREA DA IMAGEM
        ========================================= */

        .image-area {

            background: #b9a6e8;

            border: 6px solid #4d416e;

            padding: 20px;

            text-align: center;
        }


        .image-area img {

            width: 260px;

            height: 260px;

            object-fit: contain;

            image-rendering: pixelated;

            background: #dce8c0;

            border: 5px solid #59684b;
        }


        /* =========================================
           CORES DOS TIPOS
        ========================================= */

        .type-normal {

            background: #A8A878;
        }


        .type-fire {

            background: #F08030;
        }


        .type-water {

            background: #6890F0;
        }


        .type-electric {

            background: #F8D030;
        }


        .type-grass {

            background: #78C850;
        }


        .type-ice {

            background: #98D8D8;
        }


        .type-fighting {

            background: #C03028;
        }


        .type-poison {

            background: #A040A0;
        }


        .type-ground {

            background: #E0C068;
        }


        .type-flying {

            background: #A890F0;
        }


        .type-psychic {

            background: #F85888;
        }


        .type-bug {

            background: #A8B820;
        }


        .type-rock {

            background: #B8A038;
        }


        .type-ghost {

            background: #705898;
        }


        .type-dragon {

            background: #7038F8;
        }


        .type-dark {

            background: #705848;
        }


        .type-steel {

            background: #B8B8D0;
        }


        .type-fairy {

            background: #EE99AC;
        }


        /* =========================================
           TIPOS
        ========================================= */

        .types {

            margin-top: 15px;

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        .type {

            padding: 8px 14px;

            border: 4px solid #71621b;

            font-weight: bold;

            text-transform: uppercase;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            background: #b9a6e8;

            border: 6px solid #4d416e;

            padding: 15px;
        }


        .title-status {

            background: #e8c928;

            border: 4px solid #71621b;

            padding: 8px;

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 15px;
        }


        .status-row {

            display: grid;

            grid-template-columns:
                160px 1fr 70px;

            align-items: center;

            gap: 10px;

            margin-bottom: 10px;

            font-weight: bold;
        }


        /* =========================================
           BARRAS DOS STATUS
        ========================================= */

        .bar {

            height: 22px;

            background: #d6d6d6;

            border: 3px solid #555;
        }


        .bar-filledOut {

            height: 100%;

            background: #62bd78;

            width: 0%;
        }


        .value {

            text-align: right;

            font-size: 18px;
        }


        /* =========================================
           HABILIDADE
        ========================================= */

        .ability {

            margin-top: 20px;

            background: #b9a6e8;

            border: 6px solid #4d416e;

            padding: 15px;
        }


        .ability h2 {

            background: #e8c928;

            border: 4px solid #71621b;

            padding: 7px;

            margin-bottom: 10px;

            font-size: 20px;
        }


        .ability p {

            font-size: 18px;

            text-transform: capitalize;
        }


        /* =========================================
           RESPONSIVIDADE
        ========================================= */

        @media (max-width: 750px) {

            .content {

                grid-template-columns: 1fr;
            }


            .image-area img {

                width: 220px;

                height: 220px;
            }


            .status-row {

                grid-template-columns:
                    120px 1fr 60px;
            }

        }


        @media (max-width: 450px) {

            body {

                padding: 10px;
            }


            .header-pokemon {

                flex-direction: column;

                gap: 10px;

                text-align: center;
            }


            .status-row {

                grid-template-columns:
                    1fr;

                gap: 3px;
            }


            .value {

                text-align: left;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         BOTÃO VOLTAR
    ========================================== -->

    <a
        href="../index.html"
        class="return"
    >

        ◀ VOLTAR

    </a>


    <!-- =========================================
         TELA DO POKÉMON
    ========================================== -->

    <main class="pokemon-screen">


        <!-- =====================================
             CABEÇALHO
        ====================================== -->

        <header class="header-pokemon">


            <h1
                id="name"
                class="name"
            >

                Carregando...

            </h1>


            <span
                id="number"
                class="number"
            >

                Nº ---

            </span>


        </header>


        <!-- =====================================
             CONTEÚDO
        ====================================== -->

        <section class="content">


            <!-- =================================
                 IMAGEM + TIPOS
            ================================== -->

            <div
                id="image-area"
                class="image-area"
            >


                <img
                    id="image"
                    src=""
                    alt="pokemon"
                >


                <div
                    id="types"
                    class="types"
                >

                </div>


            </div>


            <!-- =================================
                 STATUS + HABILIDADE
            ================================== -->

            <div>


                <!-- STATUS -->

                <div class="status">


                    <div class="title-status">

                        STATUS

                    </div>


                    <!-- HP -->

                    <div class="status-row">

                        <span>
                            Vida
                        </span>


                        <div class="bar">

                            <div
                                id="bar-hp"
                                class="bar-filledOut"
                            ></div>

                        </div>


                        <span
                            id="hp"
                            class="value"
                        >

                            0

                        </span>

                    </div>


                    <!-- ATAQUE -->

                    <div class="status-row">

                        <span>
                            Ataque
                        </span>


                        <div class="bar">

                            <div
                                id="bar-attack"
                                class="bar-filledOut"
                            ></div>

                        </div>


                        <span
                            id="attack"
                            class="value"
                        >

                            0

                        </span>

                    </div>


                    <!-- DEFESA -->

                    <div class="status-row">

                        <span>
                            Defesa
                        </span>


                        <div class="bar">

                            <div
                                id="bar-defense"
                                class="bar-filledOut"
                            ></div>

                        </div>


                        <span
                            id="defense"
                            class="value"
                        >

                            0

                        </span>

                    </div>


                    <!-- VELOCIDADE -->

                    <div class="status-row">

                        <span>
                            Velocidade
                        </span>


                        <div class="bar">

                            <div
                                id="bar-speed"
                                class="bar-filledOut"
                            ></div>

                        </div>


                        <span
                            id="speed"
                            class="value"
                        >

                            0

                        </span>

                    </div>


                    <!-- ATAQUE ESPECIAL -->

                    <div class="status-row">

                        <span>
                            Ataque Especial
                        </span>


                        <div class="bar">

                            <div
                                id="bar-sp-attack"
                                class="bar-filledOut"
                            ></div>

                        </div>


                        <span
                            id="sp-attack"
                            class="value"
                        >

                            0

                        </span>

                    </div>


                    <!-- DEFESA ESPECIAL -->

                    <div class="status-row">

                        <span>
                            Defesa Especial
                        </span>


                        <div class="bar">

                            <div
                                id="bar-sp-defense"
                                class="bar-filledOut"
                            ></div>

                        </div>


                        <span
                            id="sp-defense"
                            class="value"
                        >

                            0

                        </span>

                    </div>


                </div>


                <!-- =================================
                     HABILIDADE
                ================================== -->

                <div class="ability">


                    <h2>

                        HABILIDADE ESPECIAL

                    </h2>


                    <p id="ability">

                        Carregando...

                    </p>


                </div>


            </div>


        </section>


    </main>


    <script>


        /* =========================================
           BUSCAR POKÉMON NO LOCAL STORAGE
        ========================================= */

        function searchPokemon() {


            /*
                Pega o Pokémon salvo
                na página inicial.
            */

            const savedPokemon =
                localStorage.getItem(
                    "SelectedPokemon"
                );


            /*
                Verifica se existe
                um Pokémon salvo.
            */

            if (!savedPokemon) {


                document
                    .getElementById("name")
                    .textContent =
                    "Pokémon não encontrado";


                return;

            }


            /*
                Converte o texto JSON
                novamente para objeto.
            */

            const pokemon =
                JSON.parse(savedPokemon);


            showPokemon(pokemon);

        }


        /* =========================================
           MOSTRAR DADOS DO POKÉMON
        ========================================= */

        function showPokemon(pokemon) {


            /* =====================================
               TIPO PRINCIPAL
            ===================================== */

            const mainType =
                pokemon.types[0]
                    .type.name;


            /*
                Adiciona a cor do tipo
                na área da imagem.
            */

            document
                .getElementById("image-area")
                .classList.add(
                    `type-${mainType}`
                );


            /* =====================================
               NOME
            ===================================== */

            document
                .getElementById("name")
                .textContent =
                pokemon.name;


            /* =====================================
               NÚMERO
            ===================================== */

            document
                .getElementById("number")
                .textContent =
                `Nº ${String(pokemon.id)
                    .padStart(3, "0")}`;


            /* =====================================
               IMAGEM
            ===================================== */

            document
                .getElementById("image")
                .src =
                pokemon.sprites
                    .front_default;


            document
                .getElementById("image")
                .alt =
                pokemon.name;


            /* =====================================
               TIPOS
            ===================================== */

            const types =
                document.getElementById(
                    "types"
                );


            types.innerHTML = "";


            pokemon.types.forEach(
                typePokemon => {


                    const type =
                        document.createElement(
                            "span"
                        );


                    /*
                        Adiciona a classe geral
                        e a classe específica
                        do tipo.
                    */

                    type.classList.add(

                        "type",

                        `type-${typePokemon.type.name}`

                    );


                    type.textContent =
                        typePokemon.type.name;


                    types.appendChild(type);

                }
            );


            /* =====================================
               PEGAR OS STATUS
            ===================================== */

            const stats = {};


            pokemon.stats.forEach(
                stat => {


                    stats[stat.stat.name] =
                        stat.base_stat;

                }
            );


            /* =====================================
               MOSTRAR STATUS
            ===================================== */

            showStatus(
                "hp",
                "bar-hp",
                stats.hp
            );


            showStatus(
                "attack",
                "bar-attack",
                stats.attack
            );


            showStatus(
                "defense",
                "bar-defense",
                stats.defense
            );


            showStatus(
                "speed",
                "bar-speed",
                stats.speed
            );


            showStatus(
                "sp-attack",
                "bar-sp-attack",
                stats["special-attack"]
            );


            showStatus(
                "sp-defense",
                "bar-sp-defense",
                stats["special-defense"]
            );


            /* =====================================
               HABILIDADE ESPECIAL
            ===================================== */

            const ability =
                pokemon.abilities[0];


            if (ability) {


                document
                    .getElementById("ability")
                    .textContent =
                    ability.ability.name;


            } else {


                document
                    .getElementById("ability")
                    .textContent =
                    "Nenhuma habilidade encontrada";

            }

        }


        /* =========================================
           MOSTRAR STATUS E BARRA
        ========================================= */

        function showStatus(
            element,
            bar,
            value
        ) {


            /*
                Mostra o valor do status.
            */

            document
                .getElementById(element)
                .textContent =
                value;


            /*
                Calcula a porcentagem
                da barra.

                255 é usado como referência
                para o maior valor de status base.
            */

            let percentage =
                (value / 255) * 100;


            /*
                Impede a barra de passar
                de 100%.
            */

            if (
                percentage > 100
            ) {

                percentage = 100;

            }


            /*
                Define a largura da barra.
            */

            document
                .getElementById(bar)
                .style.width =
                `${percentage}%`;

        }


        /* =========================================
           INICIAR
        ========================================= */

        searchPokemon();

    </script>


</body>

</html>
